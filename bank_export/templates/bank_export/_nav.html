{% load i18n %}
<div style="margin-bottom:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
  <a class="oh-btn oh-btn--light" href="{% url 'bx-dashboard' %}">{% trans "Bank export" %}</a>
  {% if perms.bank_export.view_bank_accounts %}<a class="oh-btn oh-btn--light" href="{% url 'bx-accounts' %}">{% trans "Worker bank accounts" %}</a>{% endif %}
  {% if perms.bank_export.view_bank %}<a class="oh-btn oh-btn--light" href="{% url 'bx-banks' %}">{% trans "Bank list" %}</a>{% endif %}
</div>
{% if messages %}{% for m in messages %}<p style="padding:.5rem;background:#f3f3f3;">{{ m }}</p>{% endfor %}{% endif %}
