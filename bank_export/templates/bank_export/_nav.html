{% load i18n %}{% with n=request.resolver_match.url_name %}
<div class="oh-tabs">
    <ul class="oh-tabs__tablist">
      <li class="oh-tabs__tab {% if n == 'bx-dashboard' or n == 'bx-run' %}oh-tabs__tab--active{% endif %}"><a href="{% url 'bx-dashboard' %}" class="text-reset">{% trans "Payment files" %}</a></li>
      {% if perms.bank_export.view_bank_accounts %}<li class="oh-tabs__tab {% if n == 'bx-accounts' or n == 'bx-account-edit' %}oh-tabs__tab--active{% endif %}"><a href="{% url 'bx-accounts' %}" class="text-reset">{% trans "Worker bank accounts" %}</a></li>{% endif %}
      {% if perms.bank_export.view_bank %}<li class="oh-tabs__tab {% if n == 'bx-banks' %}oh-tabs__tab--active{% endif %}"><a href="{% url 'bx-banks' %}" class="text-reset">{% trans "Bank list" %}</a></li>{% endif %}
    </ul>
</div>{% endwith %}
